databaseChangeLog:
  - changeSet:
      id: create-resume-skills-table
      author: AnatoliiNazarov
      changes:
        - createTable:
            tableName: resume_skills
            columns:
              - column:
                  name: resume_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: skill_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: resume_skills
            baseColumnNames: resume_id
            referencedTableName: resumes
            referencedColumnNames: id
            constraintName: fk_resume_skills_resume
        - addForeignKeyConstraint:
            baseTableName: resume_skills
            baseColumnNames: skill_id
            referencedTableName: skills
            referencedColumnNames: id
            constraintName: fk_resume_skills_skill
