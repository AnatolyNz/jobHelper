databaseChangeLog:
  - changeSet:
      id: create-job-applications-table
      author: AnatoliiNazarov
      changes:
        - createTable:
            tableName: job_applications
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: job_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: job_applications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_job_application_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: job_applications
            baseColumnNames: job_id
            referencedTableName: jobs
            referencedColumnNames: id
            constraintName: fk_job_application_job
            onDelete: CASCADE

