databaseChangeLog:
  - changeSet:
      id: create-skills-table
      author: AnatoliiNazarov
      changes:
        - createTable:
            tableName: skills
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
