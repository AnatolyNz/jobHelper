databaseChangeLog:
  - changeSet:
      id: create-job-application-statuses-table
      author: AnatoliiNazarov
      changes:
        - createTable:
            tableName: job_application_statuses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: job_application_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: job_application_statuses
            baseColumnNames: job_application_id
            referencedTableName: job_applications
            referencedColumnNames: id
            constraintName: fk_job_application_status_job_application
            onDelete: CASCADE
